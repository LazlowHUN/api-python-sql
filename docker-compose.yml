services:
  postgres_db:
    image: postgres:15-alpine
    container_name: weather_postgres
    env_file: .env
    ports:
      - 5433:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d weather_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  etl_app:
    build: .
    container_name: weather_etl_app
    env_file: .env
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  pgdata: